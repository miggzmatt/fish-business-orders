<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b5d">
  <meta name="description" content="Open the Fish Business customer order form.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Fish Business Orders</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f6fa; color: #243447; display: grid; place-items: center; padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); }
    main { width: 100%; max-width: 440px; background: #fff; border-radius: 22px; padding: 30px 24px; text-align: center; box-shadow: 0 8px 30px #102b4418; }
    .logo { width: 92px; height: 92px; display: block; margin: 0 auto 18px; border-radius: 22px; }
    h1 { color: #123b5d; font-size: 25px; margin: 0 0 8px; }
    .intro { color: #607286; line-height: 1.5; margin: 0 auto 24px; max-width: 330px; }
    .open { display: block; width: 100%; padding: 16px 18px; border-radius: 12px; background: #1f4e78; color: white; text-decoration: none; font-weight: 700; font-size: 17px; }
    .open:active { transform: translateY(1px); }
    .install { display: none; width: 100%; margin-top: 12px; padding: 13px 16px; border: 1px solid #cbd6e2; border-radius: 12px; background: #fff; color: #1f4e78; font-weight: 700; font-size: 15px; }
    .help { color: #758396; font-size: 12px; line-height: 1.5; margin: 18px 0 0; }
    footer { color: #91a0af; font-size: 11px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./icons/icon-192.png" alt="Fish Business Orders icon">
    <h1>Fish Business Orders</h1>
    <p class="intro">Welcome! Tap below to open the customer order form and submit a fish order.</p>
    <a class="open" href="https://script.google.com/macros/s/AKfycbywDmm3GE43_-6B1FZGVL3X5_Upod-7N0n-ubz2bCzGDbb0GuC713xenvdHPaPjMguuzg/exec" target="_blank" rel="noopener">Open Customer Order Form</a>
    <button class="install" id="installButton" type="button">Install Fish Business Orders</button>
    <p class="help">The order form opens securely through Google Apps Script. An internet connection is required to place an order.</p>
    <footer>Fish Business · Customer Orders</footer>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.error('Service worker registration failed:', err)));
    }
    let installPrompt;
    const installButton = document.getElementById('installButton');
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); installPrompt = event; installButton.style.display = 'block';
    });
    installButton.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; installButton.style.display = 'none';
    });
    window.addEventListener('appinstalled', () => installButton.style.display = 'none');
  </script>
</body>
</html>
