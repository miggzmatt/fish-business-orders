
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b5d">
  <meta name="description" content="Fish Business customer ordering app.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Fish Business Orders</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #243447;
    }

    header {
      background: #123b5d;
      color: white;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .tagline {
      font-size: 12px;
      opacity: .8;
      margin-top: 4px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      color: #123b5d;
      font-size: 25px;
      margin: 0 0 8px;
    }

    .welcome p {
      color: #64748b;
      margin: 0;
      line-height: 1.5;
    }

    .form-card {
      background: white;
      border: 1px solid #e1e7ee;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 20px #102b440c;
    }

    .form-heading {
      padding: 17px 20px;
      border-bottom: 1px solid #e8edf2;
      font-weight: bold;
      color: #123b5d;
    }

    iframe {
      display: block;
      width: 100%;
      height: 1500px;
      border: 0;
      background: white;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #8290a0;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      .container { padding: 20px 12px; }
      .welcome h1 { font-size: 22px; }
      iframe { height: 1650px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="brand">🐟 Fish Business</div>
      <div class="tagline">Fresh Fish · Easy Ordering</div>
    </div>
  </header>

  <main class="container">
    <section class="welcome">
      <h1>Welcome!</h1>
      <p>
        Place your fish order conveniently using our online
        ordering form. Complete your details below.
      </p>
    </section>

    <section class="form-card">
      <div class="form-heading">Customer Order Form</div>

      <iframe
        src="https://script.google.com/macros/s/AKfycbywDmm3GE43_-6B1FZGVL3X5_Upod-7N0n-ubz2bCzGDbb0GuC713xenvdHPaPjMguuzg/exec"
        title="Fish Business Customer Order Form"
        loading="lazy"
        allow="clipboard-write">
      </iframe>
    </section>
  </main>

  <footer>
    Fish Business Orders · Thank you for your order!
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error(error));
      });
    }
  </script>
</body>
</html>
